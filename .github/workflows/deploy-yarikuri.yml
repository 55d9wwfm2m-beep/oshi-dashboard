name: Deploy yarikuri to GitHub Pages

# site/ の内容を gh-pages ブランチへ同期して公開する。
# Pages のソースは gh-pages ブランチ（初回プッシュ時に自動有効化済み）。
on:
  workflow_dispatch:
  push:
    branches: [claude/mobile-money-calculator-ndye1f, main]
    paths: ['site/**', '.github/workflows/deploy-yarikuri.yml']

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish site/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
